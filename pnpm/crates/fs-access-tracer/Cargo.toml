[package]
name = "pnpm-fs-access-tracer"
description = "Record the files a process tree reads, probes, lists, and writes"
version = "0.0.1"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pnpm-fs-access-protocol = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
pnpm-detours-sys = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_System_Performance"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[build-dependencies]
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }

[lints]
workspace = true
